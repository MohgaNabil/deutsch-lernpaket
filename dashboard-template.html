<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Language Learning Dashboard</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #faf9f4;
  color: #1a1a1a;
  margin: 0;
  padding: 24px;
  line-height: 1.5;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { color: #2a4d3a; margin: 0 0 4px 0; font-size: 28px; }
h2 { color: #2a4d3a; margin: 32px 0 12px 0; font-size: 20px; border-bottom: 2px solid #e8e5d4; padding-bottom: 6px; }
h3 { color: #4a4a4a; margin: 16px 0 8px 0; font-size: 15px; font-weight: 600; }
.subtitle { color: #777; font-size: 14px; margin-bottom: 8px; }
.banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 8px 0 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.banner.snapshot { background: #fff7e6; border: 1px solid #f0d99a; color: #6b5118; }
.banner.live { background: #e8f5e8; border: 1px solid #a8d4a8; color: #2a4d3a; }
.banner button { background: #2a4d3a; color: white; border: 0; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.banner button:hover { background: #3a6d4a; }
.banner button:disabled { background: #aaa; cursor: not-allowed; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 8px 0; }
.kpi-card { background: white; border: 1px solid #e8e5d4; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.kpi-value { font-size: 28px; font-weight: 700; color: #2a4d3a; line-height: 1.1; }
.kpi-label { font-size: 12px; color: #777; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
.card { background: white; border: 1px solid #e8e5d4; border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.chart-box { position: relative; height: 280px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { background: #f0ede4; text-align: left; padding: 8px 10px; font-weight: 600; color: #4a4a4a; border-bottom: 1px solid #e0ddd0; }
table.data td { padding: 8px 10px; border-bottom: 1px solid #f0ede4; vertical-align: top; }
table.data tr:last-child td { border-bottom: none; }
.tag { display: inline-block; background: #e8efe5; color: #2a4d3a; padding: 4px 10px; border-radius: 14px; font-size: 12px; margin: 3px 4px 3px 0; }
.tag.dim { background: #eee; color: #888; }
.heatmap { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 0; }
.cell { width: 14px; height: 14px; border-radius: 3px; background: #ebe8d8; position: relative; }
.cell.conv { background: #6b9b7a; }
.cell.review { background: #b3c9b9; }
.cell.both { background: #2a4d3a; }
.cell[title]:hover::after {
  content: attr(title); position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
  background: #333; color: white; padding: 3px 7px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10;
}
.legend { font-size: 12px; color: #666; display: flex; gap: 12px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
.hint { color: #888; font-size: 12px; font-style: italic; }
.bar-bg { background: #ebe8d8; border-radius: 4px; height: 8px; overflow: hidden; margin: 4px 0; }
.bar-fill { background: #6b9b7a; height: 100%; }
.flex { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding: 3px 0; }
.muted { color: #888; font-size: 12px; }
.section-intro { font-size: 13px; color: #777; margin: 4px 0 12px 0; }
.vtabs-nav { display: flex; gap: 2px; border-bottom: 2px solid #e0ddd0; margin: 16px 0 12px 0; flex-wrap: wrap; }
.vtab { background: none; border: none; padding: 8px 14px; font-size: 13px; color: #666; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; border-radius: 6px 6px 0 0; }
.vtab.active { color: #2a4d3a; border-bottom-color: #6b9b7a; font-weight: 700; background: #f8f7f0; }
.vtab:hover:not(.active) { background: #f5f3eb; color: #2a4d3a; }
.vtab-count { color: #999; font-size: 11px; margin-left: 4px; }
.vtab.active .vtab-count { color: #6b9b7a; }
.vtab-panel { display: none; }
.vtab-panel.active { display: block; }
.vtab-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.vsearch { flex: 1; min-width: 180px; padding: 7px 12px; border: 1px solid #d6d3c4; border-radius: 6px; font-size: 13px; background: white; }
.vsearch:focus { outline: none; border-color: #6b9b7a; box-shadow: 0 0 0 2px #6b9b7a33; }
.vtheme-filter, .vsort-toggle { padding: 7px 10px; border: 1px solid #d6d3c4; border-radius: 6px; font-size: 13px; background: white; cursor: pointer; }
.vtab-list { max-height: 420px; overflow-y: auto; padding-right: 4px; border: 1px solid #f0ede4; border-radius: 6px; }
.vitem { padding: 8px 12px; border-bottom: 1px solid #f5f3eb; display: grid; grid-template-columns: minmax(140px, 1fr) 2fr auto; gap: 12px; align-items: baseline; font-size: 13px; }
.vitem:last-child { border-bottom: none; }
.vitem:hover { background: #faf9f4; }
.vitem-word { font-weight: 600; color: #2a4d3a; }
.vitem-meaning { color: #555; font-size: 12px; }
.vitem-meta { color: #999; font-size: 11px; text-align: right; white-space: nowrap; }
.vitem.stale .vitem-meta { color: #c8863a; font-weight: 600; }
.vitem.stale .vitem-word::before { content: "⏰ "; font-size: 11px; }
.vgroup-header { font-size: 11px; font-weight: 700; color: #777; text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 12px 4px 12px; background: #f5f3eb; border-bottom: 1px solid #e8e5d4; }
.vtab-empty { padding: 30px 20px; text-align: center; color: #888; font-size: 13px; }
.diag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #888; background: #f5f3eb; padding: 8px; border-radius: 6px; white-space: pre-wrap; margin-top: 8px; max-height: 200px; overflow: auto; }
details summary { cursor: pointer; color: #888; font-size: 12px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>

<script>
// === LEARNER CONFIG (keep in sync with learning-config.json, or ask Claude to sync it) ===

// === SNAPSHOT DATA (regenerated each time you ask Claude to refresh the dashboard) ===

// Ask Claude to read your Apple Notes and replace SNAPSHOT_SESSIONS / SNAPSHOT_REVIEW_DATES
// with your real session history the first time you set this up.
const SNAPSHOT_ASOF = "2026-09-01";
const SNAPSHOT_SESSIONS = [

    ],

    ],

    ],
    "idioms": [
      { "idiom": "die Welt entdecken", "literal": "to discover the world", "meaning": "to travel and explore", "example": "Sie will die Welt entdecken, bevor sie mit dem Studium beginnt." }
    ],

      { "num": "2", "category": "Word Order", "wrong": "Ich habe gestern, weil es geregnet hat, das Museum besucht", "right": "Ich habe gestern das Museum besucht, weil es geregnet hat", "explanation": "Nebensatz meist ans Ende, nicht mitten im Hauptsatz." }
    ],
    "stats": { "Responses": 12, "Total words": 310, "Average words per response": 26, "Complex sentences (subordinate clauses)": 6, "dass-Sätze": 2, "weil-Sätze": 2, "wenn-Sätze": 1, "Konjunktiv II": 1, "Passiv": 0, "Genitiv": 1, "Questions initiated": 0, "Reused old words": 1, "Reused old idioms": 0, "Session length (minutes)": 35 }
  }
];
const SNAPSHOT_REVIEW_DATES = ["2026-08-22", "2026-08-28"];

const CATEGORY_COLORS = {
  'Article/Gender': '#6b9b7a', 'Case': '#c4885a', 'Word Order': '#7a8fb8',
  'Verb Form': '#d4a85a', 'Preposition': '#a87ba8', 'Word Choice': '#5a9fa8',
  'Vocabulary': '#b85a7a', 'Spelling': '#8a8a5a', 'Compounding': '#a8a8a8',
  'Other': '#bdbdbd', 'Uncategorized': '#cccccc'
};

let lastDiag = '';

function normalizeMcpResponse(resp, depth) {
  depth = depth || 0;
  if (depth > 6 || resp == null) return resp;
  if (Array.isArray(resp)) return resp;
  if (typeof resp === 'object') {
    if (Array.isArray(resp.content)) {
      const text = resp.content.map(c => (c && typeof c.text === 'string') ? c.text : '').join('');
      return normalizeMcpResponse(text, depth + 1);
    }
    if (resp.result !== undefined) return normalizeMcpResponse(resp.result, depth + 1);
    if (resp.data !== undefined) return normalizeMcpResponse(resp.data, depth + 1);
    return resp;
  }
  if (typeof resp === 'string') {
    const trimmed = resp.trim();
    if (trimmed && (trimmed.startsWith('[') || trimmed.startsWith('{') || trimmed.startsWith('"'))) {
      try { return normalizeMcpResponse(JSON.parse(trimmed), depth + 1); } catch {}
    }
    return resp;
  }
  return resp;
}

async function tryLiveLoad() {
  const diagLines = [];
  if (!window.cowork || typeof window.cowork.callMcpTool !== 'function') {
    return { ok: false, diag: 'window.cowork.callMcpTool not available' };
  }
  const attempts = [{}, { limit: 50 }, { limit: 30 }];
  let list = null;
  for (const args of attempts) {
    try {
      const raw = await window.cowork.callMcpTool('mcp__Read_and_Write_Apple_Notes__list_notes', args);
      if (raw && raw.isError) {
        const txt = Array.isArray(raw.content) ? raw.content.map(c => c && c.text).join('') : String(raw);
        diagLines.push('list_notes ' + JSON.stringify(args) + ' -> error: ' + txt.slice(0, 200));
        continue;
      }
      const norm = normalizeMcpResponse(raw);
      if (Array.isArray(norm)) { list = norm; diagLines.push('list_notes ' + JSON.stringify(args) + ' -> ok, ' + norm.length + ' notes'); break; }
      diagLines.push('list_notes ' + JSON.stringify(args) + ' -> unexpected: ' + (typeof norm));
    } catch (e) {
      diagLines.push('list_notes ' + JSON.stringify(args) + ' -> threw: ' + (e.message || String(e)));
    }
  }
  if (!list) return { ok: false, diag: diagLines.join('\n') };

  const seen = new Set();
  const convNotes = [], reviewNotes = [];
  list.forEach(n => {
    if (!n || !n.name) return;
    const k = n.id || n.name;
    if (seen.has(k)) return; seen.add(k);
    if (n.name.startsWith(CONFIG.notePrefixConversation)) convNotes.push(n);
    else if (n.name.startsWith(CONFIG.notePrefixQuiz)) reviewNotes.push(n);
  });
  diagLines.push('Found ' + convNotes.length + ' conversation notes and ' + reviewNotes.length + ' review notes');

  const sessions = [];
  for (const n of convNotes) {
    try {
      const raw = await window.cowork.callMcpTool('mcp__Read_and_Write_Apple_Notes__get_note_content', { note_name: n.name });
      if (raw && raw.isError) { diagLines.push('get_note_content "' + n.name + '" -> error'); continue; }
      const norm = normalizeMcpResponse(raw);
      const html = typeof norm === 'string' ? norm : JSON.stringify(norm);
      const session = parseNote(html, n.name);
      if (session.date) sessions.push(session);
    } catch (e) {
      diagLines.push('get_note_content "' + n.name + '" -> ' + (e.message || String(e)));
    }
  }
  const reviewDates = reviewNotes.map(n => { const m = n.name.match(/(\d{4}-\d{2}-\d{2})/); return m ? m[1] : null; }).filter(Boolean);
  if (sessions.length === 0) return { ok: false, diag: diagLines.join('\n') };
  sessions.sort((a, b) => a.date.localeCompare(b.date));
  return { ok: true, sessions, reviewDates, diag: diagLines.join('\n') };
}

function parseNote(html, noteName) {
  const dateMatch = noteName.match(/(\d{4}-\d{2}-\d{2})/);
  const themeMatch = noteName.match(/\d{4}-\d{2}-\d{2},\s*(.+)$/);
  const session = {
    date: dateMatch ? dateMatch[1] : null,
    theme: themeMatch ? themeMatch[1].trim() : 'Unknown',
    name: noteName,
    nouns: [], adjectives: [], verbs: [], idioms: [], mistakes: [], stats: {}
  };
  if (typeof html !== 'string') return session;
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tables = Array.from(doc.querySelectorAll('table'));
  tables.forEach(t => {
    const rows = Array.from(t.querySelectorAll('tr'));
    if (rows.length === 0) return;
    const header = Array.from(rows[0].querySelectorAll('td,th')).map(c => c.textContent.trim());
    const data = rows.slice(1).map(tr => Array.from(tr.querySelectorAll('td,th')).map(c => c.textContent.trim()));
    if (data.length === 0) return;
    if (header.includes('Word') && header.includes('Plural')) {
      session.nouns.push(...data.map(r => ({ word: r[0]||'', plural: r[1]||'', meaning: r[2]||'', example: r[3]||'' })));
    } else if (header[0] === 'Adjective') {
      session.adjectives.push(...data.map(r => ({ word: r[0]||'', meaning: r[1]||'', example: r[2]||'' })));
    } else if (header[0] === 'Infinitive') {
      session.verbs.push(...data.map(r => ({ infinitive: r[0]||'', presens: r[1]||'', perfekt: r[2]||'', meaning: r[3]||'', example: r[4]||'' })));
    } else if (header[0] === 'Idiom') {
      session.idioms.push(...data.map(r => ({ idiom: r[0]||'', literal: r[1]||'', meaning: r[2]||'', example: r[3]||'' })));
    } else if (header.includes('Category') && header.includes('Wrong')) {
      session.mistakes.push(...data.map(r => ({ num: r[0]||'', category: (r[1]||'Other').trim(), wrong: r[2]||'', right: r[3]||'', explanation: r[4]||'' })));
    } else if (header[0] === '#' && header.includes('Wrong')) {
      session.mistakes.push(...data.map(r => ({ num: r[0]||'', category: 'Uncategorized', wrong: r[1]||'', right: r[2]||'', explanation: r[3]||'' })));
    } else if (header[0] === 'Metric') {
      data.forEach(r => {
        const key = r[0]||''; const val = r[1]||'';
        const num = parseInt(String(val).replace(/[^\d\-]/g, ''), 10);
        session.stats[key] = isNaN(num) ? val : num;
      });
    }
  });
  return session;
}

function setBanner(mode, diag) {
  const bar = document.getElementById('banner');
  if (mode === 'live') {
    bar.className = 'banner live';
    bar.innerHTML = '<span><b>Live</b> data from your Apple Notes, refreshed just now.</span><button id="refreshBtn">Refresh again</button>';
  } else {
    const detail = diag ? `<details style="margin-top:6px"><summary>Why am I seeing a snapshot?</summary><div class="diag">${escapeHtml(diag)}</div></details>` : '';
    bar.className = 'banner snapshot';
    bar.innerHTML = `<span><b>Snapshot</b> from ${SNAPSHOT_ASOF}. The live Apple Notes bridge from this artifact sandbox is not responding (HTTP 400). Ask Claude "refresh my dashboard" to rebake with the latest data.${detail}</span><button id="refreshBtn">Try live again</button>`;
  }
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.onclick = boot;
}

async function boot() {
  document.title = `${CONFIG.targetLanguage} ${CONFIG.cefrLevel} Dashboard`;
  document.getElementById('mainTitle').textContent = `${CONFIG.targetLanguage} ${CONFIG.cefrLevel} Dashboard`;
  document.getElementById('app').innerHTML = '<div class="card" style="text-align:center;color:#888;padding:40px">Trying live Apple Notes...</div>';
  setBanner('snapshot', 'Trying live load...');
  const live = await tryLiveLoad();
  if (live.ok) {
    setBanner('live');
    render(live.sessions, live.reviewDates);
  } else {
    setBanner('snapshot', live.diag);
    render(SNAPSHOT_SESSIONS, SNAPSHOT_REVIEW_DATES);
  }
}

function render(sessions, reviewDates) {
  const totalSessions = sessions.length;
  const allNouns = new Map(), allAdj = new Map(), allVerbs = new Map(), allIdioms = new Map();
  let totalMistakes = 0;
  const mistakeByCat = {};
  const catSessionSet = new Map(); // category -> Set of session dates it appeared in
  sessions.forEach(s => {
    s.nouns.forEach(n => { if (n.word) { const k = n.word.toLowerCase(); const prev = allNouns.get(k); allNouns.set(k, { ...n, firstDate: prev?.firstDate || s.date, firstTheme: prev?.firstTheme || s.theme }); } });
    s.adjectives.forEach(a => { if (a.word) { const k = a.word.toLowerCase(); const prev = allAdj.get(k); allAdj.set(k, { ...a, firstDate: prev?.firstDate || s.date, firstTheme: prev?.firstTheme || s.theme }); } });
    s.verbs.forEach(v => { const k = (v.infinitive||'').toLowerCase().split(/[\s(]/)[0]; if (k) { const prev = allVerbs.get(k); allVerbs.set(k, { ...v, firstDate: prev?.firstDate || s.date, firstTheme: prev?.firstTheme || s.theme }); } });
    s.idioms.forEach(i => { if (i.idiom) { const k = i.idiom.toLowerCase(); const prev = allIdioms.get(k); allIdioms.set(k, { ...i, firstDate: prev?.firstDate || s.date, firstTheme: prev?.firstTheme || s.theme }); } });
    const seenCatsThisSession = new Set();
    s.mistakes.forEach(m => {
      totalMistakes++;
      const cat = m.category || 'Other';
      mistakeByCat[cat] = (mistakeByCat[cat] || 0) + 1;
      if (!seenCatsThisSession.has(cat)) {
        seenCatsThisSession.add(cat);
        if (!catSessionSet.has(cat)) catSessionSet.set(cat, new Set());
        catSessionSet.get(cat).add(s.date);
      }
    });
  });
  const themeCount = {};
  sessions.forEach(s => { themeCount[s.theme] = (themeCount[s.theme] || 0) + 1; });
  const activitySet = new Set([...sessions.map(s => s.date), ...reviewDates].filter(Boolean));
  const streak = computeStreak(activitySet);
  const b2 = { 'dass-Sätze': 0, 'weil-Sätze': 0, 'wenn-Sätze': 0, 'Konjunktiv II': 0, 'Passiv': 0, 'Genitiv': 0, 'Complex sentences (subordinate clauses)': 0 };
  let totalWords = 0, totalQ = 0, reuseW = 0, reuseI = 0;
  sessions.forEach(s => {
    Object.keys(b2).forEach(k => { const v = s.stats[k]; if (typeof v === 'number') b2[k] += v; });
    if (typeof s.stats['Total words'] === 'number') totalWords += s.stats['Total words'];
    if (typeof s.stats['Questions initiated'] === 'number') totalQ += s.stats['Questions initiated'];
    if (typeof s.stats['Reused old words'] === 'number') reuseW += s.stats['Reused old words'];
    if (typeof s.stats['Reused old idioms'] === 'number') reuseI += s.stats['Reused old idioms'];
  });
  const topCats = Object.entries(mistakeByCat).sort((a,b) => b[1] - a[1]);

function computeStreak(dateSet) {
  if (dateSet.size === 0) return 0;
  const sorted = Array.from(dateSet).sort();
  const last = sorted[sorted.length - 1];
  if (last < daysAgo(2)) return 0;
  let streak = 1;
  let cursor = new Date(last);
  for (let i = sorted.length - 2; i >= 0; i--) {
    const d = new Date(sorted[i]);
    const diff = Math.round((cursor - d) / 86400000);
    if (diff <= 2 && diff >= 0) { streak++; cursor = d; } else break;
  }
  return streak;
}

function daysAgo(n) {
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function setupVocabTabs(allNouns, allAdj, allVerbs, allIdioms, sessions) {
  const today = new Date();
  const daysSince = d => Math.floor((today - new Date(d)) / 86400000);
  const READY_DAYS = 14;

  // Build normalized item lists
  const nounsAdjs = [
    ...Array.from(allNouns.values()).map(n => ({ ...n, displayWord: n.word, type: 'Nomen' })),
    ...Array.from(allAdj.values()).map(a => ({ ...a, displayWord: a.word, type: 'Adjektiv' }))
  ];
  const verbs = Array.from(allVerbs.values()).map(v => ({ ...v, displayWord: v.infinitive, type: 'Verb' }));
  const idioms = Array.from(allIdioms.values()).map(i => ({ ...i, displayWord: i.idiom, type: 'Redewendung' }));

  // Ready to reuse: items older than READY_DAYS
  const ready = [...nounsAdjs, ...verbs, ...idioms]
    .filter(x => x.firstDate && daysSince(x.firstDate) >= READY_DAYS);

  // Reused: empty for now (historical data doesn't have named items)
  const reused = [];

  const tabData = {
    nouns: nounsAdjs,
    verbs: verbs,
    idioms: idioms,
    ready: ready,
    reused: reused
  };

  // Update tab count spans
  const readyCountEl = document.getElementById('readyCount');
  if (readyCountEl) readyCountEl.textContent = ready.length;
  const reusedCountEl = document.getElementById('reusedCount');
  if (reusedCountEl) reusedCountEl.textContent = reused.length;

  // Collect themes from all items
  const collectThemes = items => Array.from(new Set(items.map(x => x.firstTheme).filter(Boolean))).sort();
  ['nouns', 'verbs', 'idioms', 'ready'].forEach(tab => {
    const themes = collectThemes(tabData[tab]);
    const sel = document.querySelector(`.vtheme-filter[data-tab="${tab}"]`);
    if (sel && themes.length) {
      themes.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
      });
    }
  });

  // Per-tab state
  const state = {
    nouns: { search: '', theme: 'all', sort: 'newest' },
    verbs: { search: '', theme: 'all', sort: 'newest' },
    idioms: { search: '', theme: 'all', sort: 'newest' },
    ready: { search: '', theme: 'all', sort: 'stale' },
    reused: { search: '', theme: 'all', sort: 'newest' }
  };

  function filterAndSort(items, tab) {
    const s = state[tab];
    let result = items;
    if (s.search) {
      const q = s.search.toLowerCase();
      result = result.filter(x =>
        (x.displayWord || '').toLowerCase().includes(q) ||
        (x.meaning || '').toLowerCase().includes(q) ||
        (x.example || '').toLowerCase().includes(q)
      );
    }
    if (s.theme !== 'all') {
      result = result.filter(x => (x.firstTheme || '') === s.theme);
    }
    result = [...result];
    if (s.sort === 'newest') {
      result.sort((a, b) => (b.firstDate || '').localeCompare(a.firstDate || ''));
    } else if (s.sort === 'oldest' || s.sort === 'stale') {
      result.sort((a, b) => (a.firstDate || '').localeCompare(b.firstDate || ''));
    } else if (s.sort === 'az') {
      result.sort((a, b) => (a.displayWord || '').localeCompare(b.displayWord || ''));
    }
    return result;
  }

  function renderItem(item) {
    const days = item.firstDate ? daysSince(item.firstDate) : null;
    const staleClass = days !== null && days >= READY_DAYS ? ' stale' : '';
    const dateLabel = item.firstDate ? item.firstDate + (days !== null && days >= READY_DAYS ? ` (${days}d)` : '') : '';
    const themeLabel = item.firstTheme ? `<span style="color:#8a8a5a">${escapeHtml(item.firstTheme)}</span> · ` : '';
    return `<div class="vitem${staleClass}"><span class="vitem-word">${escapeHtml(item.displayWord || '')}</span><span class="vitem-meaning">${escapeHtml(item.meaning || '')}</span><span class="vitem-meta">${themeLabel}${dateLabel}</span></div>`;
  }

  function renderList(tab) {
    const listEl = document.getElementById('vlist-' + tab);
    if (!listEl) return;
    if (tab === 'reused' && reused.length === 0) {
      listEl.innerHTML = '<div class="vtab-empty">✨ Named reused items will start appearing here after your next Tuesday session. The conversation task now saves each reused word/idiom by name in section G) of the note. Historical sessions only stored counts.</div>';
      return;
    }
    const items = filterAndSort(tabData[tab], tab);
    if (items.length === 0) {
      listEl.innerHTML = '<div class="vtab-empty">No matches. Try clearing the search or changing the filter.</div>';
      return;
    }
    listEl.innerHTML = items.map(renderItem).join('');
  }

  // Wire up tab switching
  document.querySelectorAll('.vtab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.vtab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.vtab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.vtab;
      const panel = document.getElementById('vtab-' + tab);
      if (panel) panel.classList.add('active');
    });
  });

  // Wire up search inputs
  document.querySelectorAll('.vsearch').forEach(inp => {
    inp.addEventListener('input', e => {
      const tab = e.target.dataset.tab;
      state[tab].search = e.target.value.trim();
      renderList(tab);
    });
  });

  // Wire up theme filter
  document.querySelectorAll('.vtheme-filter').forEach(sel => {
    sel.addEventListener('change', e => {
      const tab = e.target.dataset.tab;
      state[tab].theme = e.target.value;
      renderList(tab);
    });
  });

  // Wire up sort
  document.querySelectorAll('.vsort-toggle').forEach(sel => {
    sel.addEventListener('change', e => {
      const tab = e.target.dataset.tab;
      state[tab].sort = e.target.value;
      renderList(tab);
    });
  });

  // Initial render of all lists
  ['nouns', 'verbs', 'idioms', 'ready', 'reused'].forEach(renderList);
}

function renderHeatmap(sessions, reviewDates, streak) {
  const days = 56;
  const conv = new Set(sessions.map(s => s.date));
  const rev = new Set(reviewDates);
  const cells = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    let cls = 'cell';
    if (conv.has(iso) && rev.has(iso)) cls += ' both';
    else if (conv.has(iso)) cls += ' conv';
    else if (rev.has(iso)) cls += ' review';
    const label = `${iso}${conv.has(iso)?' (Conversation)':rev.has(iso)?' (Review)':''}`;
    cells.push(`<div class="${cls}" title="${label}"></div>`);
  }
  document.getElementById('heatmap').innerHTML = cells.join('');
  document.getElementById('streakHint').textContent = streak > 0
    ? `Current streak: ${streak} session day${streak===1?'':'s'} in the last week.`
    : 'No active streak. Your next scheduled session will start one.';
}

function renderCumulativeChart(rows) {
  const ctx = document.getElementById('cumulativeChart').getContext('2d');

    ctx.canvas.parentElement.innerHTML = '<div class="muted" style="padding:40px;text-align:center">No data yet.</div>';
    return;
  }
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: rows.map(r => r.date),
      datasets: [
        { label: 'Nouns/Adj', data: rows.map(r => r.nouns), borderColor: '#6b9b7a', backgroundColor: '#6b9b7a33', tension: 0.3, fill: true },
        { label: 'Verbs', data: rows.map(r => r.verbs), borderColor: '#c4885a', backgroundColor: '#c4885a33', tension: 0.3, fill: true },
        { label: 'Idioms', data: rows.map(r => r.idioms), borderColor: '#7a8fb8', backgroundColor: '#7a8fb833', tension: 0.3, fill: true }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
